name: Cron del panel (manual)

# El cron horario corre en el VPS (tarea programada de Coolify: `python manage.py cron`).
# Este workflow queda solo para dispararlo a mano si hiciera falta. Necesita el secret CRON_TOKEN.
on:
  workflow_dispatch:

jobs:
  cron:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Correr el cron
        env:
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          curl -fsS --max-time 300 -X POST -H "X-Cron-Token: $CRON_TOKEN" https://api.aurateam.cloud/api/cron/
