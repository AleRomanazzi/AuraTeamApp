# El panel se mudó al VPS (https://aurateam.cloud): Netlify solo redirige la dirección vieja, conservando la ruta.
[build]
  base    = "frontend"
  publish = "redireccion"
  command = "mkdir -p redireccion"

[[redirects]]
  from   = "/*"
  to     = "https://aurateam.cloud/:splat"
  status = 301
  force  = true
